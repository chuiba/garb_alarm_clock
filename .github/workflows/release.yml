name: Release

on:
  push:
    tags:
      - 'v*'  # v1.0.0 之类的版本标签触发

jobs:
  build-and-publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  build-windows-exe:
    name: Build Windows Executable
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build executable
        run: uv run --with pyinstaller pyinstaller garb_alarm_clock.spec --clean

      - name: Get tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          files: ./dist/garb_alarm_clock.exe
          body: |
            ## Release ${{ steps.tag.outputs.tag }}

            ### 📥 下载
            - **Python 包**：`pip install garb-alarm-clock`
            - **Windows 可执行文件**：下载下方的 `garb_alarm_clock.exe`

            ### 🔄 变更
            详见 [CHANGELOG.md](https://github.com/chuiba/garb_alarm_clock/blob/master/CHANGELOG.md)。
